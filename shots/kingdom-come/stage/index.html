  (channels/progressiveslop/assets/kingdom-come: cutouts/ -> assets/cast, layers/ -> assets/bg).
  Characters are transparent PNG poses; acting = pose swaps on beats + squash/stretch + bob.
  Every chorus ends in the CHORUS ROUTINE (see routine()), the recurring signature dance.
-->
<style>
 html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#141024;color:#fff;font-family:Inter,sans-serif}
 #camera{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
 .scene{position:absolute;inset:0;opacity:0;visibility:hidden;overflow:hidden}
 .layer{position:absolute;left:-60px;top:-60px;width:1400px;height:840px}
 .plate{position:absolute;left:-47px;top:0;width:1494px;height:840px}
 .plate.wide{width:1800px;height:1012px;top:-110px;left:-100px}
 .near{position:absolute;left:-47px;width:1494px}
 .ui{position:absolute;inset:0}
 /* actors: .act sits at the feet point; .bob is squashed/hopped from the feet; poses are stacked imgs */
 .act{position:absolute;width:0;height:0}
 .act .flip,.act .bob{position:absolute;left:0;top:0;width:0;height:0}
 .act .body{position:absolute;left:0;top:0;transform:translate(-50%,-100%) scale(var(--s,1));transform-origin:50% 100%;display:grid;place-items:end center}
 .act .body img{grid-area:1/1;visibility:hidden;filter:drop-shadow(0 6px 0 rgba(20,10,40,.35))}
 .act .body img.on{visibility:visible}
 .shadow{position:absolute;left:-70px;top:-14px;width:140px;height:26px;border-radius:50%;background:rgba(10,5,25,.35);filter:blur(3px)}
 .tint{position:absolute;inset:0;pointer-events:none}
 .spot{position:absolute;top:-80px;width:360px;height:900px;margin-left:-180px;transform-origin:50% 0;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);mix-blend-mode:screen}
 .stamp{position:absolute;left:0;right:0;top:26px;text-align:center;font:400 64px/1 Bangers,sans-serif;letter-spacing:.06em;color:#ffc83d;-webkit-text-stroke:4px #1b1030;paint-order:stroke fill;text-shadow:6px 6px 0 #1b1030}
 .stamp small{display:block;font-size:26px;color:#fff;letter-spacing:.1em;margin-top:6px}
 .cage{position:absolute;left:-105px;top:-330px;width:210px;height:330px;border:10px solid #2a2440;border-width:14px 10px;border-radius:10px 10px 4px 4px;background:repeating-linear-gradient(90deg,transparent 0 30px,#3a3358 30px 40px);box-sizing:border-box}
 .beacon{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(#fff6c0,rgba(255,190,80,.7) 30%,rgba(255,120,30,0) 70%);mix-blend-mode:screen}
 .bolt{position:absolute;inset:0;background:#d9c2ff;mix-blend-mode:screen;opacity:0}
 .title-k{text-align:center;font:900 84px/0.95 "Cinzel Decorative",serif;color:#ffc83d;text-shadow:0 6px 0 #1b1030,0 0 40px rgba(255,140,40,.6);-webkit-text-stroke:2px #1b1030}
 .title-by{text-align:center;font:400 30px Bangers,sans-serif;letter-spacing:.12em;color:#fff;text-shadow:3px 3px 0 #1b1030}
 .c-panel img.bgp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 .cr-n{position:absolute;left:0;right:0;bottom:0;padding:8px 0 10px;background:#fff6e0;border-top:5px solid #1b1030;text-align:center;font:400 40px/1 Bangers,sans-serif;letter-spacing:.06em;color:#1b1030;z-index:3}
 .cr-n small{display:block;font:700 18px "Comic Neue",sans-serif;letter-spacing:0;margin-top:4px}
 .m-lyr.slam{top:auto!important;bottom:26px;transform:none!important}
 .m-lyr.slam .w{font-size:70px!important}
 .m-lyr.comic{bottom:22px}
 /* Vertical (Shorts): title band on top, the stage in the middle, lyrics below. */
 html[data-format=vertical],html[data-format=vertical] body{width:720px;height:1280px}
 html[data-format=vertical] #camera{top:330px;left:-120px;transform:scale(.75)}
 html[data-format=vertical] #camera.comic{left:0;transform:scale(.5625)!important;top:420px}
 #vhead{display:none}
 html[data-format=vertical] #vhead{display:block;position:absolute;left:0;right:0;top:40px;text-align:center;z-index:90}
 html[data-format=vertical] .m-lyr{bottom:120px!important;padding:0 30px}

 html[data-format=vertical] .stamp{font-size:52px}
 html[data-format=vertical] .c-caption{left:140px!important}
</style></head><body>

<script src="/vendor/gsap.min.js"></script>
<script src="/kit.js"></script><script src="/music.js"></script>
<script>
const FMT = document.documentElement.dataset.format = new URLSearchParams(location.search).get('format') || 'landscape';
const V = FMT === 'vertical';
const B = (n) => Music.beats(n);
const C = Music.comic, F = Music.fx, cam = Music.cam;
const q = (s, el = document) => el.querySelector(s), qa = (s, el = document) => [...el.querySelectorAll(s)];
const SFX = (el, text, o) => C.sfx(el, text, o);
let beatOffs = [];
const onBeatScene = (fn) => beatOffs.push(Music.onBeat(fn));
function enter(el) {
  beatOffs.forEach((off) => off()); beatOffs = [];
  qa('.c-sfx,.c-bubble,.c-caption').forEach((n) => { n._off && n._off(); n.remove(); });
  qa('.cast', el).forEach((c) => (c.innerHTML = ''));
  cam.reset();
  document.getElementById('camera').classList.toggle('comic', !!el.querySelector('.c-page'));
}

/* ---------- actors from the approved cutouts ---------- */
const POSES = {
  kael: ['neutral', 'sword', 'surprised', 'cheer'], pip: ['lit', 'out', 'cracked', 'joy'],
  bramble: ['neutral', 'asleep', 'flying', 'laugh'], grimwick: ['smug', 'twirl', 'shocked', 'caged'],
  mumbles: ['cursed', 'casting', 'mending', 'dancing'],
};
/** actor(host, who, {x, y, s, pose, flip}) -> element with .pose(name), .bob, .flipEl */
function actor(host, who, { x = 640, y = 640, s = 0.7, pose, flip = false, extra = [], shadow = true } = {}) {
  const a = document.createElement('div'); a.className = 'act ' + who; a.style.left = x + 'px'; a.style.top = y + 'px';
  const poses = [...POSES[who], 'dance', ...extra];
  a.innerHTML = `${shadow ? '<div class="shadow"></div>' : ''}<div class="flip"><div class="bob"><div class="body" style="--s:${s}">${poses.map((p) => `<img data-p="${p}" src="assets/cast/${p === 'dance' ? 'dance-' + who : who + '-' + p}.png">`).join('')}</div></div></div>`;
  host.appendChild(a);
  a.bob = q('.bob', a); a.flipEl = q('.flip', a);
  a.pose = (p) => { qa('img', a).forEach((i) => i.classList.toggle('on', i.dataset.p === p)); a.cur = p; return a; };
  a.pose(pose || poses[0]);
  if (flip) gsap.set(a.flipEl, { scaleX: -1 });
  return a;
}
/** squash on landing, stretch on take-off (from the feet) */
const squash = (a, amt = 0.14, beats = 0.5) => gsap.fromTo(a.bob, { scaleY: 1 - amt, scaleX: 1 + amt * 0.8 }, { scaleY: 1, scaleX: 1, duration: B(beats), ease: 'elastic.out(1,.45)', transformOrigin: '0 0' });
const hop = (a, px = 40, beats = 0.5) => gsap.timeline()
  .to(a.bob, { y: -px, scaleY: 1.08, scaleX: 0.94, duration: B(beats / 2), ease: 'power2.out', transformOrigin: '0 0' })
  .to(a.bob, { y: 0, scaleY: 1, scaleX: 1, duration: B(beats / 2), ease: 'power2.in' })
  .add(() => squash(a, 0.12, 0.4));
/** bob on every beat (bigger on downbeats) */
const bobOnBeat = (acts, px = 12) => onBeatScene((b) => acts.forEach((a, i) => gsap.fromTo(a.bob, { y: 0 }, { y: -px * (b.downbeat ? 1.6 : 1), duration: B(0.5), yoyo: true, repeat: 1, ease: 'power2.out', delay: i * 0.03, transformOrigin: '0 0' })));
/** swap between poses on beats: seq = ['a','b'] every `every` beats */
const swapOnBeat = (a, seq, every = 1) => { let k = 0; onBeatScene((b) => { if (b.i % every) return; a.pose(seq[k++ % seq.length]); squash(a, 0.1, 0.4); }); };
let beatInBar = 0; Music.onBeat((b) => { beatInBar = b.downbeat ? 0 : beatInBar + 1; });

/* ---------- THE CHORUS ROUTINE ----------
   Same stage, same lights, same 4-beat move every chorus so it becomes the hook:
     beat 1 (downbeat): DANCE pose + KICK (hop + tilt), camera punch, spotlights swing
     beat 2: ALT pose, mirror flip
     beat 3: DANCE pose, flip back, small hop
     beat 4: ALT pose, squash
   Grimwick's participation level rises each chorus (the running gag). */
const ALT = { kael: 'cheer', pip: 'joy', bramble: 'laugh', mumbles: 'dancing', grimwick: 'twirl' };
const GRIM = [
  null,
  { gag: 'no.', pose: 'smug', join: () => false, x: 1130, note: 'refuses, arms crossed' },
  { gag: '...ugh. fine. ONE tap.', pose: 'smug', join: (k) => k === 0 && 'tap', x: 1130 },
  { gag: 'only the downbeats. for dignity.', pose: 'smug', join: (k) => (k === 0 ? 'full' : k === 2 ? 'tap' : false), x: 1120 },
  { gag: 'this proves NOTHING', pose: 'twirl', join: () => 'full', x: 1100 },
  { gag: 'I LOVE THIS SONG!!', pose: 'dance', join: () => 'full', x: 640, center: true, cage: true },
];
function routine(n) {
  Webshot.scene('dance' + n, (tl, el, idle) => {
    enter(el);
    const floor = q('.danceflr', el), g = GRIM[n], last = n === 5;
    floor.innerHTML = `<div class="layer" data-depth="0.3"><img class="plate" src="assets/bg/${last ? 'bg-town-party' : 'bg-kingdom'}-far.jpg" alt="" style="filter:${last ? 'none' : 'brightness(.5) saturate(1.2)'}"></div>
      <div class="tint" style="background:radial-gradient(ellipse at 50% 90%,rgba(255,79,163,.25),rgba(20,10,50,.55))"></div>
      <div class="layer" data-depth="1"><img class="near" src="assets/bg/${last ? 'bg-town-party' : 'bg-kingdom'}-near.png" alt="" style="top:${last ? 672 : 588}px"><div class="spots"></div><div class="cast"></div></div>
      <div class="ui"><div class="stamp">THE KINGDOM COME<small>— official chorus routine #${n} —</small></div></div>`;
    const cast = q('.cast', floor), spots = q('.spots', floor), ui = q('.ui', floor);
    [300, 640, 980].forEach((x, i) => { const s = document.createElement('div'); s.className = 'spot'; s.style.left = x + 60 + 'px'; spots.appendChild(s); gsap.set(s, { rotation: (i - 1) * 14 }); });
    const xs = V ? (g.center ? [330, 470, 810, 950] : [300, 440, 590, 740]) : (g.center ? [190, 380, 900, 1090] : [200, 400, 600, 800]);
    const who = ['kael', 'pip', 'bramble', 'mumbles'];
    const ds = who.map((w, i) => actor(cast, w, { x: xs[i] + 60, y: 665, s: w === 'bramble' ? 0.78 : 0.74, pose: 'dance' }));
    const gx = V ? (g.center ? 640 : 860) : g.x;
    const gw = actor(cast, 'grimwick', { x: gx + 60, y: 665, s: g.center ? 0.85 : 0.74, pose: g.pose });
    if (g.cage) { const c = document.createElement('div'); c.className = 'cage'; gw.appendChild(c); gsap.set(c, { scale: 0.92, transformOrigin: '50% 100%' }); }
    if (n >= 4) gsap.set(gw, { zIndex: 2 });
    tl.from(q('.stamp', ui), { scale: 2.2, autoAlpha: 0, rotation: -6, duration: B(0.5), ease: 'power4.in' }, 0);
    tl.add(() => { cam.shake(10, 0.5); SFX(ui, n === 1 ? 'DANCE BREAK!' : 'AGAIN!', { x: V ? 420 : 940, y: 150, size: 64, rot: 8, color: '#ff4fa3' }); }, B(0.5));
    tl.add(() => C.bubble(ui, g.gag, { x: V ? 600 : gx - 330, y: g.center ? 170 : 210, tail: g.center ? 170 : 300 }), B(n === 1 ? 4 : 2));
    if (n === 4) tl.add(() => C.caption(ui, '(the drum is cracked. the routine is sacred.)', { x: 24, y: 640 }), B(6));
    if (n === 5) tl.add(() => Music.particles(ui, { kind: 'confetti', rate: 16 }), 0);
    tl.add(() => {}, B(12));
    const step = (k) => {
      const kick = k === 0, flipOn = k === 1;
      ds.forEach((d, i) => {
        const w = who[i];
        d.pose(k % 2 ? ALT[w] : 'dance');
        gsap.to(d.flipEl, { scaleX: flipOn ? -1 : 1, duration: B(0.15) });
        if (kick) { hop(d, 46); gsap.fromTo(d.bob, { rotation: -10 }, { rotation: 0, duration: B(0.8), ease: 'back.out(3)', transformOrigin: '0 0' }); }
        else if (k === 2) hop(d, 22);
        else squash(d, 0.16);
      });
      const j = g.join(k);
      if (j === 'full') { gw.pose(k % 2 ? 'twirl' : 'dance'); gsap.to(gw.flipEl, { scaleX: flipOn ? -1 : 1, duration: B(0.15) }); kick ? hop(gw, n === 5 ? 70 : 46) : squash(gw, 0.16); if (n === 5 && kick) gsap.fromTo(gw.bob, { rotation: 0 }, { rotation: 360, duration: B(0.6), ease: 'power2.out', transformOrigin: '0 -150px' }); }
      else if (j === 'tap') { gw.pose(n === 2 ? 'smug' : 'dance'); squash(gw, 0.07); }
      else { gw.pose(g.pose); if (n === 4) gw.pose('twirl'); }
      if (kick) { cam.punch(0.035, 1); qa('.spot', spots).forEach((s, i) => gsap.to(s, { rotation: (beatOffs.length + i) % 2 ? 18 : -18, duration: B(0.9), ease: 'power2.inOut' })); }
    };
    onBeatScene(() => step(beatInBar % 4));
  });
}
[1, 2, 3, 4, 5].forEach(routine);

(async () => {
await Music.load('timeline.json');
Music.theme('fantasy');
Music.lyrics({ styleFor: (l) => (/chorus/.test(l.tag) ? 'slam' : 'comic'), hot: 'kingdom|drum|fire|whole|dragons|legend|arrow|wizard|justice|balance|shattered' });

// 1 OPEN: dusk kingdom, unlit beacon. Title slams; Pip glows; Grimwick strolls in and snuffs him.
Webshot.scene('open', (tl, el, idle) => {
  enter(el); const cast = q('.cast', el), ui = q('.ui', el);
  const pip = actor(cast, 'pip', { x: 520, y: 650, s: 0.62, pose: 'lit' });
  const gw = actor(cast, 'grimwick', { x: 1200, y: 650, s: 0.72, pose: 'twirl', flip: false });
  cam.set({ zoom: 1.08, x: 40 }); tl.add(() => cam.to({ zoom: 1, x: 0 }, 8), 0);
  tl.from('#op-title .title-k', { scale: 2.5, autoAlpha: 0, duration: B(0.5), ease: 'power4.in' }, B(0.2)).from('#op-title .title-by', { y: 30, autoAlpha: 0, duration: B(1) }, B(1));
  tl.add(() => SFX(ui, 'THOOM', { x: 120, y: 330, size: 80, rot: -8 }), B(1));
  tl.to('#op-title', { autoAlpha: 0, y: -40, duration: B(1) }, B(7));
  tl.from(gw, { x: 300, duration: B(2), ease: 'power2.out' }, B(8));
  tl.to(gw, { left: 820, duration: B(2), ease: 'power1.inOut' }, B(8));
  tl.add(() => C.bubble(ui, 'mine now. hah!', { x: 780, y: 240, tail: 220 }), B(10));
  tl.add(() => { pip.pose('out'); squash(pip, 0.25, 1); gw.pose('smug'); SFX(ui, 'FWOOSH', { x: 600, y: 300, size: 70, color: '#5ee7ff' }); gsap.to('#op-dark', { background: 'rgba(20,10,50,.45)', duration: B(1) }); }, B(13));
  tl.add(() => C.caption(ui, 'The kingdom\'s fire went out.', { x: 24, y: 24 }), B(14));
  tl.add(() => {}, B(19));
  bobOnBeat([pip], 6);
