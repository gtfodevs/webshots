<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kingdom Come 16-bit · ProgressiveSlop</title>
<!--
  Kingdom Come, 16-bit pass ("pixel game" style, docs/MUSIC_MODE.md). The whole video is ONE low-res
  canvas (480x270, or 270x480 for Shorts) drawn every frame from the song clock. Sprites come from an
  atlas built by ../build_assets.py; every position is an integer, smoothing is off, and the recorder
  captures the viewport at an integer device scale (4x) so pixels stay exact blocks.
  Sections are <section> stubs only so `npm run check` sees the scene list; drawing is time-driven.
-->
<style>
 html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#000}
 #g{position:absolute;left:0;top:0;width:100vw;height:100vh;image-rendering:pixelated}
 .scene{display:none}
</style></head><body>
<canvas id="g"></canvas>
<section class="scene" id="s-title"></section><section class="scene" id="s-stage1"></section><section class="scene" id="s-dance1"></section>
<section class="scene" id="s-stage2"></section><section class="scene" id="s-dance2"></section><section class="scene" id="s-stage3"></section>
<section class="scene" id="s-dance3"></section><section class="scene" id="s-stage4"></section><section class="scene" id="s-dance4"></section>
<section class="scene" id="s-boss"></section><section class="scene" id="s-dance5"></section><section class="scene" id="s-party"></section><section class="scene" id="s-end"></section>
<script src="/vendor/gsap.min.js"></script>
<script src="/kit.js"></script>
<script src="/music.js"></script>
<script>
(async () => {
const VERT = new URLSearchParams(location.search).get('format') === 'vertical' || document.documentElement.dataset.format === 'vertical';
const W = 480, H = 270;                       // world (game screen)
const cv = document.getElementById('g');
cv.width = VERT ? 270 : 480; cv.height = VERT ? 480 : 270;
const out = cv.getContext('2d'); out.imageSmoothingEnabled = false;
const wc = document.createElement('canvas'); wc.width = W; wc.height = H;
const g = wc.getContext('2d'); g.imageSmoothingEnabled = false;
const R = Math.round;
// safe HUD edges: in Shorts only world x 105..375 is shown
const HL = VERT ? 113 : 8, HR = VERT ? 367 : 472;

const TL = await Music.load('timeline.json');
const DB = TL.downbeats, BT = TL.beats;
const bar = (n) => DB[n];
const img = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; });
const S = await (await fetch('assets/px/sprites.json')).json();
const atlas = await img('assets/px/sprites.png');
const font = await img('assets/px/font8.png');
const BG = {}; for (const k of ['kingdom', 'forest', 'lair', 'hall']) BG[k] = { full: await img(`assets/px/bg-${k}.png`), far: await img(`assets/px/bg-${k}-far.png`), near: await img(`assets/px/bg-${k}-near.png`) };
const SPLIT = await (await fetch('assets/px/bg.json')).json();

// ---------- deterministic helpers ----------
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const beatIdx = (t) => { let lo = 0, hi = BT.length - 1; if (t < BT[0]) return -1; while (lo < hi) { const m = (lo + hi + 1) >> 1; BT[m] <= t ? lo = m : hi = m - 1; } return lo; };
const beatPhase = (t) => { const i = beatIdx(t); if (i < 0) return 0; const a = BT[i], b = BT[i + 1] ?? a + Music.beatLen; return (t - a) / (b - a); };

// ---------- sprites ----------
// spr(ctx, anim, x, y, t, opts): anchor = bottom centre, integer pixels only.
// Frame index: time-driven at the anim's fps (opts.t0 = loop start) or beat-driven (opts.beat: frames per beat).
const flipCache = new Map();
function frameOf(anim, t, o = {}) {
  const a = S[anim]; const n = a.frames.length;
  if (o.frame != null) return Math.min(n - 1, o.frame);
  if (o.beat) { const b = beatIdx(t); return ((b * o.beat + Math.floor(beatPhase(t) * o.beat) + (o.seed | 0)) % n + n) % n; }
  const k = Math.floor((t - (o.t0 || 0)) * (o.fps || a.fps) + (o.seed || 0));
  return o.once ? clamp(k, 0, n - 1) : ((k % n) + n) % n;
}
function spr(c, anim, x, y, t, o = {}) {
  const a = S[anim]; const [sx, sy, w, h] = a.frames[frameOf(anim, t, o)];
  const dx = R(x - w / 2), dy = R(y - h + 1);
  if (window.__qa && window.__qa.log) window.__qa.draws.push([anim, frameOf(anim, t, o), dx, dy, R(y), o.air ? 1 : 0]);
  if (o.white) { c.drawImage(whiteAtlas(), sx, sy, w, h, dx, dy, w, h); return; }
  if (o.flip) { c.save(); c.translate(dx + w, dy); c.scale(-1, 1); c.drawImage(atlas, sx, sy, w, h, 0, 0, w, h); c.restore(); }
  else c.drawImage(atlas, sx, sy, w, h, dx, dy, w, h);
}
let _white; function whiteAtlas() { if (_white) return _white; const k = document.createElement('canvas'); k.width = atlas.width; k.height = atlas.height; const x = k.getContext('2d'); x.drawImage(atlas, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, k.width, k.height); return (_white = k); }

// ---------- bitmap font ----------
const tints = new Map();
function tint(col) { if (tints.has(col)) return tints.get(col); const k = document.createElement('canvas'); k.width = font.width; k.height = 8; const x = k.getContext('2d'); x.drawImage(font, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, k.width, 8); tints.set(col, k); return k; }
const textW = (s, sc = 1) => s.length * 8 * sc;
function text(c, s, x, y, col = '#fff', sc = 1, align = 'left', shadow = '#12062a') {
  s = String(s); let X = align === 'center' ? x - textW(s, sc) / 2 : align === 'right' ? x - textW(s, sc) : x; X = R(X); y = R(y);
  const draw = (ox, oy, k) => { for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i) - 32; if (ch <= 0 || ch > 94) continue; c.drawImage(k, ch * 8, 0, 8, 8, X + i * 8 * sc + ox, y + oy, 8 * sc, 8 * sc); } };
  if (shadow) draw(sc, sc, tint(shadow));
  draw(0, 0, tint(col));
}
// Big logo text: per-row colour bands + 1px outline (16-bit title style)
function logo(c, s, cx, y, sc, bands) {
  const X = R(cx - textW(s, sc) / 2);
  for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [2, 2], [3, 3], [-1, -1], [1, 1]]) text(c, s, X + ox, y + oy, '#12062a', sc, 'left', null);
  for (let r = 0; r < 8; r++) {
    const k = tint(bands[r]);
    for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i) - 32; if (ch <= 0) continue; c.drawImage(k, ch * 8, r, 8, 1, X + i * 8 * sc, y + r * sc, 8 * sc, sc); }
  }
}
function wrap(s, max) { const out = []; let line = ''; for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > max) { out.push(line.trim()); line = w; } else line += ' ' + w; } if (line.trim()) out.push(line.trim()); return out; }
function box(c, x, y, w, h) { // classic RPG window
  c.fillStyle = '#12062a'; c.fillRect(x, y, w, h);
  c.fillStyle = '#e8ecff'; c.fillRect(x + 1, y + 1, w - 2, h - 2);
  c.fillStyle = '#2a1270'; c.fillRect(x + 2, y + 2, w - 4, h - 4);
  c.fillStyle = '#1d0b52'; for (let yy = y + 3; yy < y + h - 3; yy += 2) c.fillRect(x + 3, yy, w - 6, 1);
  c.fillStyle = '#5ee7ff'; c.fillRect(x + 3, y + 3, w - 6, 1);
}

// ---------- backgrounds ----------
function bgStatic(k, dx = 0, dy = 0) { g.drawImage(BG[k].full, R(dx), R(dy)); }
function bgScroll(k, cam) { // 2-band parallax: far band 0.35x, near band (floor) 1x; mirrored loop textures (960 px)
  const sy = SPLIT[k], far = BG[k].far, near = BG[k].near, tw = far.width;
  const f = R(cam * 0.35) % tw, n = R(cam) % tw;
  g.drawImage(far, -f, 0); g.drawImage(far, tw - f, 0);
  g.drawImage(near, -n, sy); g.drawImage(near, tw - n, sy);
}
function fgPlants(cam, t, col = '#1a0838') { // nearest parallax layer: dark crystal silhouettes at 1.6x
  const off = R(cam * 1.6);
  for (let i = 0; i < 40; i++) {
    const wx = i * 97 + R(hash(i) * 40), x = ((wx - off) % 1200 + 1200) % 1200 - 60; const h = 14 + R(hash(i + 9) * 22);
    g.fillStyle = col; g.fillRect(x, H - h, 6, h); g.fillRect(x - 4, H - h + 6, 4, h - 6); g.fillRect(x + 6, H - h + 10, 5, h - 10);
    g.fillStyle = i % 2 ? '#ff3fd2' : '#5ee7ff'; g.fillRect(x + 2, H - h, 2, 2);
  }
}
function tintAll(col) { g.fillStyle = col; g.fillRect(0, 0, W, H); }

// ---------- HUD ----------
const KILLS = []; // [time, points]
let NKILL = 0, NBOSSHIT = 0;
function initKills() { if (KILLS.length) return; for (const [name, t0] of SC) { if (!CH.stages[name]) continue; const P = stagePlan(name, t0);
  for (const sg of P.segs) if (sg.fight) for (const e of CH.fights[sg.fight].events) { const tt = timeOfBeat(sg.b + e[0]);
    if (e[2] === 'down') { KILLS.push([tt, e[1] === 'B' ? 5000 : 100]); if (e[1] !== 'B') NKILL++; } if (e[2] === 'hit') { KILLS.push([tt, 250]); if (e[1] === 'B') NBOSSHIT++; } } } }
function score(t) { initKills(); let s = Math.max(0, beatIdx(t)) * 10; for (const [k, p] of KILLS) if (t >= k) s += p; return s; }
function hud(t, extra) {
  text(g, '1UP', HL, 6, '#ff3fd2'); text(g, String(score(t)).padStart(7, '0'), HL, 16, '#fff');
  if (!VERT) text(g, 'HI 9999990', HR, 6, '#5ee7ff', 1, 'right');
  if (extra) text(g, extra, VERT ? 300 : W / 2, VERT ? 16 : 6, '#ffe36b', 1, 'center');
}
function hpBar(x, y, w, v, col, label, right) {
  g.fillStyle = '#12062a'; g.fillRect(x - 1, y - 1, w + 2, 8);
  g.fillStyle = '#3a1c4a'; g.fillRect(x, y, w, 6);
  g.fillStyle = col; const f = R(w * clamp(v, 0, 1)); g.fillRect(right ? x + w - f : x, y, f, 6);
  g.fillStyle = '#ffffff55'; g.fillRect(right ? x + w - f : x, y, f, 1);
  text(g, label, right ? x + w : x, y + 9, '#fff', 1, right ? 'right' : 'left');
}
function stageCard(t, t0, n, name) { // full-screen card for one bar
  const d = t - t0; if (d < 0 || d > Music.barLen) return;
  g.fillStyle = '#0b0618'; g.fillRect(0, 0, W, H);
  const k = R(clamp(d / 0.25, 0, 1) * 24);
  g.fillStyle = '#ff3fd2'; g.fillRect(0, 118 - k, W, 2); g.fillRect(0, 150 + k, W, 2);
  logo(g, n, W / 2, 104, 3, ['#ffffff', '#ffffff', '#e8ecff', '#bff6ff', '#5ee7ff', '#5ee7ff', '#7a34c8', '#7a34c8']);
  if (d > 0.35) text(g, name, W / 2, 138, '#ffe36b', 1, 'center');
}

// ---------- lyrics ----------
const LY = TL.lyrics;
function lyricAt(t) { for (const l of LY) if (t >= l.t - 0.05 && t < Math.max(l.end + 0.4, l.t + 1.2)) return l; return null; }
function lyrics(t, c, cw, chh, by) { // c = output ctx, cw = width, by = bottom
  const l = lyricAt(t); if (!l || t < bar(6)) return;
  const sung = l.words.filter((w) => w.t <= t + 0.04).length;
  const words = l.text.split(' ');
  if (/chorus/.test(l.tag)) { // arcade text: big magenta, word by word
    const sc = 2, max = Math.floor((cw - 16) / 16);
    const lines = wrap(l.text, max); let k = 0;
    lines.forEach((ln, j) => { const ws = ln.split(' '); let x = cw / 2 - textW(ln, sc) / 2;
      ws.forEach((w) => { const on = k < Math.max(1, sung); const col = on ? (w.toLowerCase().startsWith('kingdom') || w.toLowerCase() === 'come' ? '#ff3fd2' : '#ffffff') : null;
        if (col) text(c, w, x, by - (lines.length - j) * 20, col, sc, 'left', '#12062a'); x += textW(w + ' ', sc); k++; }); });
  } else { // RPG text box, typed per sung word
    const bw = cw - 16, bh = VERT ? 58 : 40, x = 8, y = by - bh;
    box(c, x, y, bw, bh);
    text(c, 'UNO', x + 8, y - 6, '#ffe36b'); // name tag
    const max = Math.floor((bw - 16) / 8);
    const lines = wrap(words.slice(0, Math.max(1, sung)).join(' '), max);
    lines.slice(-((bh - 12) / 12 | 0)).forEach((ln, j) => text(c, ln, x + 8, y + 8 + j * 12, '#fff'));
    if (sung >= words.length && Math.floor(t * 3) % 2) text(c, '\x7f'.replace('\x7f', 'v'), x + bw - 14, y + bh - 10, '#5ee7ff', 1, 'left', null);
  }
}

// ---------- shared cast moments ----------
const ROUTINE_CROWD = { dance1: 4, dance2: 8, dance3: 12, dance4: 16, dance5: 24, party: 24 };
function danceHall(t, t0, who) {
  const b = Math.max(0, beatIdx(t)), ph = beatPhase(t);
  bgStatic('hall');
  // beat light: floor flash on every beat (flat colour band, pixel-exact)
  const p = Math.exp(-5 * ph); g.globalAlpha = 0.18 * p; g.fillStyle = b % 2 ? '#5ee7ff' : '#ff3fd2'; g.fillRect(0, 196, W, 74); g.globalAlpha = 1;
  const n = ROUTINE_CROWD[who] || 8;
  // crowd: two rows flanking the heroes (centre x 160..320 stays clear), each dancer on its own phase
  const SLOTS = [[130, 214], [350, 214], [92, 206], [388, 206], [54, 214], [426, 214], [150, 198], [330, 198], [112, 196], [368, 196], [20, 204], [460, 204], [74, 196], [406, 196], [36, 192], [444, 192], [140, 186], [340, 186], [100, 184], [380, 184], [60, 184], [420, 184], [172, 192], [308, 192]];
  SLOTS.slice(0, n).map((p, i) => [...p, i]).sort((a, b) => a[1] - b[1]).forEach(([x, y, i]) => ground('crowd' + ((i + (i >> 1)) % 6), x, y, t, { beat: 1, seed: i % 3 }));
  if (who === 'dance5' || who === 'party') { ground('wizard_idle', 70, 226, t, { beat: 1 }); ground('jester_hop', 128, 228, t, { beat: 2 }); ground('crowd5', 410, 226, t, { beat: 1 }); ground('crowd4', 362, 228, t, { beat: 1, seed: 1 }); }
  // THE routine: 8 frames per bar (2 per beat), identical every chorus
  ground('uno_dance', 200, GROUND.hall, t, { beat: 2 });
  ground('aura_dance', 284, GROUND.hall, t, { beat: 2 });
  if (t - t0 < Music.barLen) { const blink = Math.floor((t - t0) * 6) % 2; if (blink) text(g, 'BONUS STAGE', W / 2, 40, '#ffe36b', 2, 'center'); }
  hud(t, 'DANCE PARTY');
}

// ---------- world: ground lines, parallax layers, choreography ----------
const WORLD = await (await fetch('assets/px/world.json')).json();
const GROUND = WORLD.ground;                       // floor row per background; grounded sprites stand ON it
const FL = []; for (const L of WORLD.forest_layers) FL.push({ ...L, im: await img('assets/px/' + L.img) });
const CH = await (await fetch('choreo.json')).json();
function parallax(cam, dark) {                     // 5 layers at 0.1/0.3/0.6/1.0/1.4x, whole-pixel offsets
  const offs = [];
  FL.forEach((L, i) => { if (i === 4) return; const tw = L.im.width, o = ((R(cam * L.speed) % tw) + tw) % tw; offs.push(o);
    for (let x = -o; x < W; x += tw) g.drawImage(L.im, x, L.y); });
  if (dark) tintAll('rgba(24,0,60,0.42)');
  return offs;
}
function parallaxFG(cam) { const L = FL[4], tw = L.im.width, o = ((R(cam * L.speed) % tw) + tw) % tw; for (let x = -o; x < W; x += tw) g.drawImage(L.im, x, 0); return o; }
if (window.__qa) window.__qa.layers = (cam) => FL.map((L) => R(cam * L.speed));

// ---------- choreography engine ----------
const LAY = CH.layout;
const BL = () => Music.beatLen;
function stagePlan(name, t0) {                    // absolute beat index where each segment starts
  const st = CH.stages[name]; const b0 = beatIdx(t0 + 0.01) + st.start; let b = b0; const segs = [];
  for (const s of st.segments) { segs.push({ kind: s[0], fight: s[0] === 'fight' ? s[1] : null, len: s[s.length - 1], b }); b += s[s.length - 1]; }
  return { st, b0, segs };
}
const beatPos = (t) => { const i = beatIdx(t); return i + beatPhase(t); };   // fractional song beat
const timeOfBeat = (b) => { const i = Math.floor(b); const a = BT[i] ?? BT[BT.length - 1], c = BT[i + 1] ?? a + BL(); return a + (c - a) * (b - i); };
const STRIDE = 14;                                  // px per beat; = walk stride, so feet stay planted

// actor state at local beat lb from an event list
function lastEv(evs, id, lb) { let e = null; for (const x of evs) if (x[1] === id && x[0] <= lb) if (!e || x[0] >= e[0]) e = x; return e; }
function heroHP(t) { let hp = 1; for (const [name, t0] of SC) { const st = CH.stages[name]; if (!st || t < t0) continue; const P = stagePlan(name, t0);
  for (const s of P.segs) if (s.fight) for (const e of CH.fights[s.fight].events) if (e[2] === 'recoil' && timeOfBeat(s.b + e[0]) <= t) hp -= 0.08; } return Math.max(0.2, hp); }
const flash = (t, tHit) => t >= tHit && t < tHit + 2 / 30;    // hit flash: exactly 2 frames

// pixel dissolve: blocks drop out progressively + rising pixel particles
const dz = document.createElement('canvas'), dzc = dz.getContext('2d');
function dissolve(anim, x, y, t, p, seed) {
  const a = S[anim]; const [sx, sy, w, h] = a.frames[0]; dz.width = w; dz.height = h; dzc.clearRect(0, 0, w, h); dzc.drawImage(atlas, sx, sy, w, h, 0, 0, w, h);
  for (let by = 0; by < h; by += 2) for (let bx = 0; bx < w; bx += 2) if (hash(bx * 31 + by * 7 + seed) < p * 1.15 - (by / h) * 0.15) dzc.clearRect(bx, by, 2, 2);
  g.drawImage(dz, R(x - w / 2), R(y - h + 1));
  for (let i = 0; i < 26; i++) { const px = R(x - w / 2 + hash(i + seed) * w), py = R(y - h * hash(i * 3 + seed) - p * 30 * (0.5 + hash(i + 9))); if (hash(i * 7) < p + 0.2 && p < 0.95) { g.fillStyle = ['#e8ecff', '#9aa3cf', '#ff3fd2', '#5ee7ff'][i % 4]; g.fillRect(px, py, 2, 2); } }
}
function shadow(x, y, w) { g.fillStyle = 'rgba(10,0,24,0.45)'; const hw = R(w * 0.32); g.fillRect(R(x) - hw, y + 1, hw * 2, 1); g.fillRect(R(x) - hw + 2, y + 2, hw * 2 - 4, 1); }
function ground(anim, x, G, t, o = {}) {           // grounded sprite: shadow + feet on the floor row
  const a = S[anim]; shadow(x, G, Math.min(a.w, 40)); spr(g, anim, x, G, t, o);
}

const ENEMY = {   // per type: anims, range x, entry
  knight: { walk: 'knight_march', idle: 'knight_idle', tel: 'knight_telegraph', atk: 'knight_attack', hit: 'knight_hit', down: 'knight_down', dis: 'knight_dissolve', x: 254, lunge: 14 },
  wolf: { walk: 'wolf_run', idle: 'wolf_run', tel: 'wolf_telegraph', atk: 'wolf_attack', hit: 'wolf_hit', down: 'wolf_down', dis: 'wolf_down', x: 262, lunge: 0, leap: true },
  spider: { walk: 'spider_walk', idle: 'spider_walk', tel: 'spider_telegraph', atk: 'spider_attack', hit: 'spider_hit', down: 'spider_down', dis: 'spider_down', x: 258, lunge: 10 },
  bat: { walk: 'bat_fly', idle: 'bat_fly', tel: 'bat_telegraph', atk: 'bat_attack', hit: 'bat_hit', down: 'bat_down', dis: 'bat_down', x: 262, fly: 44, swoop: true },
  serpent: { walk: 'serpent_idle', idle: 'serpent_idle', tel: 'serpent_telegraph', atk: 'serpent_attack', hit: 'serpent_hit', down: 'serpent_down', dis: 'serpent_down', x: 336, rise: true, breath: true },
};
function heroX(id) { return LAY[id]; }

function drawFight(fname, bStart, t, G, opts = {}) {
  const F = CH.fights[fname], evs = F.events, lb = beatPos(t) - bStart, T = (b) => timeOfBeat(bStart + b);
  let shake = 0; const fx = [];          // deferred effects drawn on top
  // ---- enemies ----
  const pos = {};
  for (const [id, type] of Object.entries(F.enemies)) {
    if (type === 'boss') continue;
    const E = ENEMY[type]; const ent = evs.find((e) => e[1] === id && e[2] === 'enter'); if (!ent || lb < ent[0]) continue;
    const ev = lastEv(evs, id, lb); const d = lb - ev[0]; const act = ev[2];
    const nxt = evs.filter((e) => e[1] === id && e[0] > ev[0]).sort((a, b) => a[0] - b[0])[0];
    let x = E.x + (id === 'b2' ? 30 : 0), y = G, anim = E.idle, o = { t0: T(ev[0]) }, air = !!E.fly;
    if (act === 'enter') {               // walk/run/fly in at its own stride (no sliding: 14 px per beat)
      const until = nxt ? nxt[0] - ev[0] : 2; const rem = Math.max(0, until - d);
      x = E.x + (id === 'b2' ? 30 : 0) + R(rem * STRIDE * (E.fly ? 2 : 1)); anim = E.walk; o = E.fly || E.rise ? {} : { beat: 4 };
      if (E.rise) { anim = E.idle; y = G + R(Math.max(0, 1 - d / 1.5) * 60); x = E.x; }
    } else if (act === 'telegraph') { anim = E.tel; o = { t0: T(ev[0]), fps: 8 }; }
    else if (act === 'attack') {
      anim = E.atk; o = { t0: T(ev[0]), once: true };
      const tx = heroX(ev[3]) + 20; const k = Math.sin(Math.PI * clamp(d / 0.7, 0, 1));
      if (E.leap) { x = R(E.x + (tx - E.x) * k); y = G - R(k * 18); air = true; }
      else if (E.swoop) { x = R(E.x + (tx - E.x) * k); y = G - E.fly + R(k * (E.fly - 18)); }
      else if (E.breath) { if (d < 0.9) fx.push(() => spr(g, 'fire', R(E.x - 40 - d * 60), G - 52 + R(d * 26), t, { t0: T(ev[0]) })); }

    } else if (act === 'hit') { anim = E.hit; o = { frame: 0, white: flash(t, T(ev[0])) }; x = E.x + R(clamp(d / 0.3, 0, 1) * 8); shake = d < 0.15 ? 1 : shake;
      if (d < 0.35) fx.push(() => spr(g, 'spark', E.x - 6, G - 26, t, { t0: T(ev[0]), once: true })); }

    const hits = evs.filter((e) => e[1] === F.hover && e[2] === 'hit'); const done = hits.filter((e) => e[0] <= lb).length;

    else if (ev[2] === 'slam' && d < 1.2) anim = 'boss_slam';
    else if (ev[2] === 'summon' && d < 1.5) anim = 'boss_summon';

    else if (act === 'recoil') { anim = id === 'uno' ? 'uno_recoil' : 'aura_recoil'; o = { frame: 0, white: flash(t, T(ev[0])) }; x = hx - R(clamp(d / 0.25, 0, 1) * 6); }

// a whole story stage: walk segments (scroll with planted feet) + fights; returns screen shake
function storyStage(name, t0, t) {

  // walked beats so far (quantized to the 4-frames-per-beat walk cycle so the ground moves with the feet)

  } else if (cur.kind === 'fight') shake = drawFight(cur.fight, cur.b, t, G);
  else if (cur.kind === 'boss_intro') {
    const lb = B - cur.b; ground('aura_walk', LAY.aura, G, t, { frame: 0 }); ground('uno_ready', LAY.uno, G, t, { frame: 0 });

// ---------- scene router (time driven) ----------
const SC = [['title', 0], ['stage1', 6], ['dance1', 10], ['stage2', 15], ['dance2', 23], ['stage3', 31], ['dance3', 40], ['stage4', 47], ['dance4', 56], ['boss', 63], ['dance5', 72], ['party', 78], ['end', 90]].map(([n, b]) => [n, b ? bar(b) : 0]);
