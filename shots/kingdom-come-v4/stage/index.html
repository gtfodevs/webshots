<script>
const FMT = document.documentElement.dataset.format = new URLSearchParams(location.search).get('format') || 'landscape';
const V = FMT === 'vertical';
const B = (n) => Music.beats(n);
const C = Music.comic, cam = Music.cam, X = Actors;
const q = (s, el = document) => el.querySelector(s), qa = (s, el = document) => [...el.querySelectorAll(s)];
const SFX = (el, text, o) => C.sfx(el, text, o);
const BAR = Object.fromEntries([['open',0],['spark',5],['dance1',9],['quest',15],['wake',23],['dance2',26],['beasts',31],['flight',40],['dance3',43],['plot',47],['shatter',56],['dance4',59],['lair',63],['relight',72],['dance5',75],['party',80],['credits',86],['end',96]]);
let T0 = 0; const AT = (sec) => Math.max(0, sec - T0);         // song seconds -> scene-relative tl position (lyric sync)
let beatOffs = [];
const onBeatScene = (fn) => beatOffs.push(Music.onBeat(fn));
function enter(el, name) {
  T0 = Music.timeline.downbeats[BAR[name]] || 0;
  beatOffs.forEach((off) => off()); beatOffs = [];
  qa('.c-sfx,.c-bubble,.c-caption,.ak-star').forEach((n) => { n._off && n._off(); n.remove(); });
  X.clear(); qa('.cast', el).forEach((c) => (c.innerHTML = ''));
  cam.reset();
  document.getElementById('camera').classList.toggle('comic', !!el.querySelector('.c-page'));
}
const BGFX = {
  kingdom: { glow: ['cyan', 'purple', 'white'], shimmer: ['cyan', 'purple'], twinkle: ['white', 'cyan'], fountain: { x: 672, y: 470, w: 200, h: 240 }, amount: 0.35 },
  forest: { glow: ['cyan', 'magenta', 'purple'], shimmer: ['purple'], twinkle: ['cyan', 'magenta', 'white'], twinkleN: 30, amount: 0.4 },
  lair: { glow: ['red', 'purple'], pulse: 'bar', amount: 0.6, base: 0.25, eyes: [[617, 176]], twinkle: ['white'], twinkleN: 10 },
  'hall-party': { glow: ['cyan', 'purple'], amount: 0.6, disco: { x: 640, y: 70, r: 64 }, twinkle: ['white'],
    lasers: [{ x: 120, y: 60, from: -60, to: -10, color: '#5ee7ff', beats: 8 }, { x: 1160, y: 60, from: 10, to: 60, color: '#ff3fd2', beats: 8, phase: 1.5 }, { x: 420, y: 40, from: -35, to: 25, color: '#b48cff', beats: 4 }, { x: 860, y: 40, from: -25, to: 35, color: '#5ee7ff', beats: 4, phase: 2 }] },
};
const bgs = (el, over = {}) => qa('[data-bg]', el).map((p) => X.bg(p, p.dataset.bg, { ...BGFX[p.dataset.bg], ...(over[p.dataset.bg] || {}) }));

/* ---------- the cast (approved ProgressiveSlop v4 set) ---------- */
X.define('uno', { poses: { stand: 'uno-stand', sword: 'uno-sword', walk: 'uno-walk', dance: 'uno-dance', lean: 'uno-lean', pump: 'uno-pump' }, cloth: 'cape', sub: 0.5, bob: 1.2, gleamTop: { sword: 0.3 }, rim: 0.6 });
X.define('aura', { poses: { stand: 'aura-stand', twirl: 'aura-twirl', walk: 'aura-walk', dance: 'aura-dance', cast: 'aura-cast', kiss: 'aura-kiss' }, hair: true, cloth: 'gown', sub: 1, sway: 1.3, headScale: 0.8, phones2: '#ff3fd2', eyeR: 0.011 });
X.define('wizard', { poses: { stand: 'cast-wizard' }, sub: 0.5, headScale: 0.7, sway: 0.8, orb: '#ff3030' });
X.define('jester', { poses: { stand: 'cast-jester' }, sub: 2, headScale: 1.4, bob: 1.3, magicAlways: false });
X.define('villain', { poses: { stand: 'cast-villain' }, sub: 0.5, headScale: 0.7, sway: 1.4, orb: '#ff2020' });
X.define('horse', { poses: { stand: 'cast-horse' }, sub: 1, headScale: 0.6, sway: 0.2, arms: 0.2, eyeR: 0.018 });
X.define('dragon', { poses: { stand: 'cast-dragon' }, sub: 1, wings: true, headScale: 0.6, sway: 0.2, arms: 0.4, eyeR: 0.03 });
X.define('guards', { poses: { stand: 'cast-guards' }, sub: 1, headScale: 0.4, sway: 0.2, arms: 0.3 });
/** act(host, who, {x, y, h, pose, anim, flip, seed, sub}) */
const act = (host, who, o) => X.actor(host, who, o).play(o.anim || 'idle');
const H = { uno: 430, aura: 400, wizard: 400, jester: 330, villain: 430, horse: 380, dragon: 190, guards: 390 };
const flip = (a, v) => { a.flip = v; a.place(); };

/* ---------- THE CHORUS ROUTINE (great hall, identical every chorus) ----------
   beat 1: everyone hops + camera punch + spotlights swing; Uno/Aura snap to their DANCE pose
   beat 2: Uno/Aura smear into the ALT pose (pump / twirl)
   beat 3: small hop; beat 4: smear back. Everyone else keeps their OWN loop at their own phase.
   The cast joins progressively: #1 Uno+Aura, #2 +Jester, #3 +Wizard+Knights, #4 +Dragon+Horse, #5 +Sorcerer (front and center). */
const LINEUP = [
  ['uno', 0], ['aura', 0], ['jester', 2], ['wizard', 3], ['guards', 3], ['dragon', 4], ['horse', 4], ['villain', 5],
];
const GAG = [null, 'just us two. for now.', 'the jester insists on joining.', 'the wizard has MOVES.', 'even the horse. even the dragon.', 'the sorcerer: reformed, and front and center.'];
function routine(n) {
  Webshot.scene('dance' + n, (tl, el) => {
    enter(el, 'dance' + n);
    const floor = q('.danceflr', el);
    floor.innerHTML = `<div class="layer" data-depth="0.3"><div class="plate" data-bg="hall-party"></div></div>
      <div class="layer" data-depth="1"><div class="spots"></div><div class="cast"></div></div><div class="vign"></div>
      <div class="ui"><div class="stamp">KINGDOM COME<small>— official chorus routine #${n} —</small></div></div>`;
    bgs(floor);
    const cast = q('.cast', floor), spots = q('.spots', floor), ui = q('.ui', floor);
    [300, 640, 980].forEach((x, i) => { const s = document.createElement('div'); s.className = 'spot'; s.style.left = x + 60 + 'px'; spots.appendChild(s); gsap.set(s, { rotation: (i - 1) * 14 }); });
    const who = LINEUP.filter(([, k]) => k <= n).map(([w]) => w);
    // stage order: villain centre on #5, Uno + Aura always centre-front
    const back = who.filter((w) => !['uno', 'aura', 'villain'].includes(w));
    const lo = V ? 310 : 120, hi = V ? 970 : 1160;
    const front = n === 5 ? ['uno', 'villain', 'aura'] : ['uno', 'aura'];
    const fx = front.length === 3 ? (V ? [520, 640, 770] : [500, 640, 790]) : (V ? [560, 740] : [540, 760]);
    const bx = back.map((_, i) => (i % 2 ? hi - Math.floor(i / 2) * (V ? 110 : 150) : lo + Math.floor(i / 2) * (V ? 110 : 150)));
    const ANIM = { jester: 'bounce', wizard: 'groove', guards: 'groove', dragon: 'hover', horse: 'groove', villain: 'dance' };
    const backs = back.map((w, i) => act(cast, w, { x: bx[i], y: w === 'dragon' ? 520 : 600, h: H[w] * 0.82, anim: ANIM[w], seed: 0.17 * i + 0.1, flip: bx[i] > 640, z: 1 }));
    const fr = front.map((w, i) => act(cast, w, { x: fx[i], y: 615, h: H[w] * (w === 'villain' ? 0.95 : 1), pose: w === 'villain' ? 'stand' : 'dance', anim: 'dance', seed: [0, 0.25, 0.5][i], flip: w === 'aura', z: 2 }));
    const [uno] = fr; const aura = fr.find((a) => a.who === 'aura');
    tl.from(q('.stamp', ui), { scale: 2.2, autoAlpha: 0, rotation: -6, duration: B(0.5), ease: 'power4.in' }, 0);
    tl.add(() => { cam.shake(10, 0.5); SFX(ui, n === 1 ? 'DANCE BREAK!' : 'AGAIN!', { x: V ? 640 : 1000, y: 160, size: 60, rot: 8, color: '#5ee7ff' }); }, B(0.5));
    tl.add(() => C.caption(ui, GAG[n], { x: V ? 260 : 24, y: 590 }), B(2));
    if (n === 5) tl.add(() => Music.particles(ui, { kind: 'confetti', rate: 16 }), 0);
    tl.add(() => {}, B(14));
    let bib = 0; const ALT = { uno: 'pump', aura: 'twirl' };
    onBeatScene((b) => {
      bib = b.downbeat ? 0 : bib + 1; const k = bib % 4;
      if (k === 0) { [...fr, ...backs].forEach((a, i) => X.hop(a, a.who === 'dragon' ? 20 : 34 + (i % 2) * 8, 0.7)); cam.punch(0.035, 1);
        qa('.spot', spots).forEach((s, i) => gsap.to(s, { rotation: (b.bar + i) % 2 ? 18 : -18, duration: B(0.9), ease: 'power2.inOut' }));
        [uno, aura].forEach((a) => a.poseName !== 'dance' && X.transition(a, 'dance', { smear: a === uno ? 'left' : 'right', beats: 0.4 })); }
      if (k === 1) [uno, aura].forEach((a) => X.transition(a, ALT[a.who], { smear: a === uno ? 'up' : 'spin', beats: 0.5 }));
      if (k === 2) fr.forEach((a) => X.hop(a, 18, 0.5));
      if (k === 3) [uno, aura].forEach((a) => X.transition(a, 'dance', { smear: 'right', beats: 0.4 }));
      if (k === 1 && n === 5) X.accent(fr[1], 'flex', 1);
    });
  });
}
[1, 2, 3, 4, 5].forEach(routine);

(async () => {
await Music.load('timeline.json');
await X.load('assets/cast/rig.json'); X.start();
Music.theme('synthwave');
Music.lyrics({ styleFor: (l) => (/chorus/.test(l.tag) ? 'slam' : 'comic'), hot: 'kingdom|drum|fire|whole|dragons|legend|arrow|wizard|justice|balance|shattered|blade|beacon' });

// 1 OPEN: the chrome kingdom at night, fountain shimmering. Title. Uno + Aura stroll in; the Sorcerer drains the light.
Webshot.scene('open', (tl, el) => {
  enter(el, 'open'); bgs(el); const cast = q('.cast', el), ui = q('.ui', el);
  const uno = act(cast, 'uno', { x: 430, y: 615, h: H.uno, pose: 'stand', anim: 'groove', seed: 0.1 });
  const aura = act(cast, 'aura', { x: 650, y: 615, h: H.aura, pose: 'stand', anim: 'groove', seed: 0.55, flip: true });
  const vil = act(cast, 'villain', { x: 1100, y: 615, h: H.villain, anim: 'menace', flip: true, seed: 0.3 });
  gsap.set(vil.el, { autoAlpha: 0 });
  cam.set({ zoom: 1.08, y: -20 }); tl.add(() => cam.to({ zoom: 1, y: 0 }, 8), 0);
  tl.from('#op-title .title-k', { scale: 2.4, autoAlpha: 0, duration: B(0.5), ease: 'power4.in' }, B(0.2)).from('#op-title .brand', { y: 30, autoAlpha: 0, duration: B(1) }, B(1)).from('#op-title .tag', { autoAlpha: 0, duration: B(1) }, B(2));
  tl.add(() => { X.accent(uno, 'flex', 1.5); X.impact(ui, 430, 330, { size: 120, color: '#5ee7ff' }); }, B(4));
  tl.add(() => { X.transition(aura, 'kiss', { smear: 'right' }); }, B(6));
  tl.to('#op-title', { autoAlpha: 0, y: -40, duration: B(1) }, B(8));
  tl.add(() => { aura.play('idle'); X.transition(aura, 'stand', { smear: 'none' }); }, B(9));
