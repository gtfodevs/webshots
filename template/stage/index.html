<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
  /* Palette + type for this video. Change these first. */
  :root {
    --bg: #fff7e8;
    --bg2: #e6f3ff;
    --ink: #24203a;
    --muted: #6b6582;
    --accent: #ff7a59;
    --accent2: #3fbfa8;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--body); color: var(--ink); }
  #bg { position: absolute; inset: 0; background: radial-gradient(1100px 700px at 30% 20%, var(--bg), var(--bg2)); }
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .scene svg { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .h1 { position: absolute; left: 0; right: 0; text-align: center; font: 700 88px/1 var(--display); }
  .h2 { position: absolute; left: 0; right: 0; text-align: center; font: 600 52px/1.1 var(--display); }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font: 800 30px/1.3 var(--body); color: var(--muted); }
  text { font-family: var(--display); font-weight: 600; }
</style>
</head>
<body>
<div id="bg"></div>

<!-- One <section> per scene. The id is "s-" + the scene name in the .scenes.json file. -->
<section class="scene" id="s-title">
  <div class="h1" style="top:120px">{{TITLE}}</div>
  <svg viewBox="0 0 1280 720">
    <!-- Position with a static wrapper; animate the inner group. -->
    <g transform="translate(640 450)">
      <g id="hero">
        <circle r="110" fill="var(--accent)" stroke="var(--ink)" stroke-width="7"/>
        <circle cx="-36" cy="-18" r="13" fill="var(--ink)"/>
        <circle cx="36" cy="-18" r="13" fill="var(--ink)"/>
        <path d="M-40 30 Q0 64 40 30" stroke="var(--ink)" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
</section>

<section class="scene" id="s-point">
  <div class="h2" style="top:70px">One idea per scene</div>
  <svg viewBox="0 0 1280 720">
    <g transform="translate(330 400)"><g class="dot"><circle r="70" fill="var(--accent2)" stroke="var(--ink)" stroke-width="6"/></g></g>
    <g transform="translate(640 400)"><g class="dot"><circle r="70" fill="var(--accent)" stroke="var(--ink)" stroke-width="6"/></g></g>
    <g transform="translate(950 400)"><g class="dot"><circle r="70" fill="#ffd166" stroke="var(--ink)" stroke-width="6"/></g></g>
    <path id="link" d="M415 400 L555 400 M725 400 L865 400" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" fill="none"/>
  </svg>
  <div class="sub" style="top:560px">Big shapes, few words, lots of motion</div>
</section>

<section class="scene" id="s-outro">
  <div class="h1" style="top:300px">The end.</div>
</section>

<script src="/vendor/gsap.min.js"></script>
<script src="/vendor/DrawSVGPlugin.min.js"></script>
<script src="/vendor/MotionPathPlugin.min.js"></script>
<script src="/kit.js"></script>
<script>
Webshot.scene('title', (tl, el, idle) => {
  tl.from(el.querySelector('.h1'), { y: -60, scale: 0.7, autoAlpha: 0, duration: 0.8, ease: 'back.out(2)' })
    .from('#hero', { scale: 0, transformOrigin: '50% 50%', duration: 0.8, ease: 'elastic.out(1, 0.5)' }, '-=0.3');
  idle(() => gsap.to('#hero', { y: '-=16', yoyo: true, repeat: -1, duration: 0.9, ease: 'sine.inOut' }));
});

Webshot.scene('point', (tl, el, idle) => {
  tl.from(el.querySelector('.h2'), { y: -40, autoAlpha: 0, duration: 0.6, ease: 'back.out(2)' })
    .from(el.querySelectorAll('.dot'), { scale: 0, transformOrigin: '50% 50%', duration: 0.6, stagger: 0.25, ease: 'back.out(2.5)' })
    .from('#link', { drawSVG: 0, duration: 0.8 })
    .from(el.querySelector('.sub'), { y: 30, autoAlpha: 0, duration: 0.5 });
  idle(() => gsap.to(el.querySelectorAll('.dot'), { y: '-=14', yoyo: true, repeat: -1, duration: 0.7, stagger: 0.15, ease: 'sine.inOut' }));
});

Webshot.scene('outro', (tl, el) => {
  tl.from(el.querySelector('.h1'), { scale: 2.2, autoAlpha: 0, duration: 0.5, ease: 'power3.in' });
});

Webshot.start();
</script>
</body>
</html>
